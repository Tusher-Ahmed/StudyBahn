<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My shortlist — StudyBahn</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;650;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page-saved">
    <header id="site-header"></header>
    <main class="container" style="padding-bottom: 80px">
      <div class="page-head">
        <h1>My shortlist</h1>
        <p class="muted">Your saved programmes, a deadline planner, and a side-by-side comparison. Stored in this browser only.</p>
      </div>
      <div class="page-tabs" role="tablist">
        <button data-tab="planner" role="tab">Deadline planner</button>
        <button data-tab="saved" role="tab">Saved programmes <span class="count" id="n-saved"></span></button>
        <button data-tab="compare" role="tab">Compare <span class="count" id="n-cmp"></span></button>
      </div>
      <div id="tab-body"></div>
    </main>
    <footer class="footer">
      <div class="container">
        <span><b>StudyBahn</b> — your track to studying in Germany</span>
        <span>Always confirm requirements and deadlines on the university's official page.</span>
      </div>
    </footer>
    <script src="data/programmes.js"></script>
    <script src="js/common.js"></script>
    <script src="js/saved.js" defer></script>
  </body>
</html>
